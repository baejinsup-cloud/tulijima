<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>털리지 마 — 몰라서 털리는 돈, 게임으로 먼저 털려보기</title>
<meta name="description" content="리볼빙·가족 사칭 문자·전세사기… 가짜 돈으로 미리 털려보는 3~5분 게임과 쉬운 돈 공부. 돈 관리 초보자를 위한 털리지 마.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="털리지 마">
<meta property="og:title" content="몰라서 털리는 돈, 게임으로 먼저 털려 보기 💸">
<meta property="og:description" content="리볼빙·가족 사칭 문자·전세사기… 가짜 돈으로 미리 털려보는 3~5분 게임과 쉬운 돈 공부">
<meta property="og:image" content="https://tulijima.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://tulijima.vercel.app/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#ffd23f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8ec; --ink:#1f1a14; --sub:#7a6f62; --line:#eadfcd; --card:#ffffff;
    --green:#17a34a; --red:#e5484d; --yellow:#ffd23f; --blue:#3b82f6; --purple:#8b5cf6;
    --shadow:0 3px 0 #1f1a14;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  .wrap{max-width:520px;margin:0 auto;padding:14px 14px 40px}
  .jua{font-family:'Jua',sans-serif;font-weight:400}
  button{font-family:inherit}
  .top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 12px}
  .logo{font-family:'Jua';font-size:26px;cursor:pointer;display:flex;align-items:center;gap:6px}
  .logo i{font-style:normal;background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:0 6px;box-shadow:var(--shadow)}
  .toplink{font-size:13px;color:var(--sub);background:none;border:0;cursor:pointer;text-decoration:underline}
  .view{display:none;animation:in .25s}
  .view.on{display:block}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .box{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .btn{display:block;width:100%;border:2px solid var(--ink);border-radius:14px;padding:13px 16px;font-size:16px;font-weight:700;cursor:pointer;background:var(--yellow);color:var(--ink);box-shadow:var(--shadow);transition:transform .08s}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  .btn.white{background:#fff}
  .btn.dark{background:var(--ink);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .s{color:var(--sub);font-size:14px;line-height:1.6}
  h2{font-family:'Jua';font-weight:400;font-size:26px;margin-bottom:6px}
  h3{font-size:17px;margin-bottom:6px}
  /* 홈 */
  .hero{text-align:center;padding:22px 16px;background:linear-gradient(160deg,#ffe58a,#ffd23f)}
  .hero .big{font-size:48px}
  .hero h1{font-family:'Jua';font-weight:400;font-size:30px;line-height:1.25;margin:6px 0 8px}
  .hero p{font-size:14px;line-height:1.6}
  .sec{font-family:'Jua';font-size:20px;margin:20px 2px 10px}
  .game{display:flex;gap:12px;align-items:center;cursor:pointer}
  .game .ic{flex:none;width:58px;height:58px;border-radius:16px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:30px}
  .game .tx{flex:1;min-width:0}
  .game .tx b{font-size:17px;display:block}
  .game .tx small{color:var(--sub);font-size:13px;line-height:1.5;display:block;margin-top:2px}
  .badge{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;border:1.5px solid var(--ink);margin-left:6px;vertical-align:2px}
  .badge.new{background:var(--green);color:#fff}
  .badge.soon{background:#eee;color:var(--sub);border-color:#ccc}
  .game.locked{opacity:.6}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tool{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:14px 12px;cursor:pointer;box-shadow:var(--shadow);text-align:left}
  .tool b{display:block;font-size:15px;margin-top:4px}
  .tool small{color:var(--sub);font-size:12px}
  .tool span{font-size:24px}
  .tool.locked{opacity:.55}
  .foot{font-size:12px;color:var(--sub);line-height:1.6;margin-top:20px;text-align:center}
  /* 게임 HUD */
  .hud{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px}
  .dayrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px}
  .dayrow b{font-family:'Jua';font-size:18px;font-weight:400}
  .dbar{height:8px;background:#eee3cf;border-radius:4px;overflow:hidden;border:1.5px solid var(--ink)}
  .dbar div{height:100%;background:var(--green);transition:width .4s}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
  .st{background:#fff;border:1.5px solid var(--ink);border-radius:12px;padding:6px 4px;text-align:center;position:relative}
  .st small{display:block;font-size:10.5px;color:var(--sub)}
  .st b{display:block;font-size:12.5px;font-weight:900;white-space:nowrap}
  .st.warn b{color:var(--red)}
  .float{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:12px;font-weight:900;animation:fl 1.2s forwards;pointer-events:none;white-space:nowrap}
  @keyframes fl{0%{opacity:0;transform:translate(-50%,6px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-22px)}}
  /* 배분 */
  .pay{text-align:center;padding:20px 14px}
  .pay .amt{font-family:'Jua';font-size:38px;color:var(--green)}
  .fixed{font-size:13px;color:var(--sub);background:#faf4e8;border-radius:12px;padding:10px 12px;margin:10px 0;line-height:1.8}
  .fixed b{color:var(--ink)}
  .slider{margin:14px 0}
  .slider .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .slider .lab b{font-size:15px}
  .slider .lab span{font-weight:900;font-size:16px}
  .slider small{color:var(--sub);font-size:12px}
  input[type=range]{width:100%;accent-color:var(--ink);height:28px}
  .living{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;margin:12px 0}
  .living b{font-family:'Jua';font-size:22px;font-weight:400}
  /* 이벤트 카드 */
  .ev .from{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .ev .from .av{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;border:1.5px solid var(--ink)}
  .ev .from b{font-size:15px;display:block}
  .ev .from small{font-size:12px;color:var(--sub)}
  .bub{background:#fef01b33;border:1.5px solid var(--ink);border-radius:4px 16px 16px 16px;padding:12px 14px;font-size:15px;line-height:1.65;white-space:pre-line}
  .bub.sms{background:#e8f0ff}
  .bub.push{background:#fff0f0}
  .bub.life{background:#f2f2f2;border-radius:16px}
  .choices{display:flex;flex-direction:column;gap:9px;margin-top:14px}
  .ch{text-align:left;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
  .ch small{display:block;font-weight:400;color:var(--sub);font-size:12.5px;margin-top:2px}
  .ch:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  .res{margin-top:14px;border-top:2px dashed var(--line);padding-top:12px}
  .res p{font-size:15px;line-height:1.65;margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .chip{font-size:13px;font-weight:700;border-radius:20px;padding:4px 10px;border:1.5px solid var(--ink)}
  .chip.m{background:#ffe1e1}
  .chip.p{background:#d9f7e3}
  .chip.n{background:#eee}
  .tipbox{background:#fff7d6;border:1.5px solid #e6c400;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.6;margin-bottom:12px}
  .tipbox b{display:block;margin-bottom:2px}
  /* 결제일 */
  .bill{font-size:14px;line-height:1.9}
  .bill .row{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:2px 0}
  .bill .row.tot{font-weight:900;border-bottom:0;font-size:15px}
  /* 결과 */
  .result{text-align:center;padding:22px 16px}
  .result .grade{display:inline-flex;width:70px;height:70px;border-radius:50%;border:3px solid var(--ink);align-items:center;justify-content:center;font-family:'Jua';font-size:40px;box-shadow:var(--shadow);margin-bottom:8px}
  .result .ttl{font-family:'Jua';font-size:28px;margin-bottom:6px}
  .result .one{font-size:14px;color:var(--sub);line-height:1.6}
  .nw{font-family:'Jua';font-size:30px;margin:10px 0 2px}
  .lesson{border-left:4px solid var(--red);padding:6px 0 6px 12px;margin:10px 0}
  .lesson b{display:block;font-size:15px;margin-bottom:2px}
  .lesson p{font-size:13.5px;line-height:1.6;color:#4a4238}
  .lesson.good{border-color:var(--green)}
  .row2{display:flex;gap:8px}
  .row2>*{flex:1}
  /* 도구 */
  .seg{display:flex;background:#f1e8d8;border-radius:12px;padding:3px;margin-bottom:12px;border:1.5px solid var(--ink)}
  .seg button{flex:1;background:none;border:0;padding:8px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;color:var(--sub)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 0 var(--ink)}
  label.f{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
  .inp{display:flex;align-items:center;border:2px solid var(--ink);border-radius:12px;background:#fff;overflow:hidden}
  .inp input{flex:1;border:0;padding:12px;font-size:16px;font-family:inherit;min-width:0;background:none}
  .inp input:focus{outline:none}
  .inp span{padding:0 12px;color:var(--sub);font-size:14px}
  .out{background:#faf4e8;border-radius:14px;padding:14px;margin-top:14px}
  .out .row{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
  .out .big{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
  .out .big b{font-family:'Jua';font-size:24px;font-weight:400}
  .note{font-size:12px;color:var(--sub);line-height:1.6;margin-top:10px}
  .toast{position:fixed;left:50%;bottom:84px;z-index:40;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:90%;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .shake{animation:sh .4s}
  @keyframes sh{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  /* 전세 */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;border:1.5px solid var(--ink);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
  .tabs button.on{background:var(--ink);color:#fff}
  .doc{border:1.5px solid #bbb;border-radius:6px;background:#fdfdfb;padding:10px;font-family:'Noto Sans KR',serif}
  .doch{font-size:12.5px;font-weight:700;text-align:center;border-bottom:1.5px double #999;padding-bottom:6px;margin-bottom:6px;color:#444}
  .dl{display:flex;gap:8px;align-items:flex-start;padding:9px 6px;border-bottom:1px dashed #ddd;cursor:pointer;border-radius:6px;font-size:14px;line-height:1.55}
  .dl:last-child{border-bottom:0}
  .dl span{flex:none;width:20px;text-align:center}
  .dl.mk{background:#ffe9e9}
  .rv{border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13.5px;line-height:1.55}
  .rv small{font-weight:700;font-size:12px}
  .rv em{display:block;font-style:normal;color:#4a4238;margin-top:2px}
  .rv.got{background:#e3f9ea}.rv.miss{background:#ffe9e9}.rv.bad{background:#f1f1f1;color:#777}
  /* 주식 */
  .srow{border-bottom:1px solid var(--line)}
  .srow:last-of-type{border-bottom:0}
  .shead{display:flex;align-items:center;gap:10px;padding:10px 2px;cursor:pointer}
  .se{font-size:24px;width:32px;text-align:center}
  .sn{flex:1;min-width:0}.sn b{display:block;font-size:15px}.sn small{font-size:12px;color:var(--sub)}
  .sp{text-align:right}.sp b{display:block;font-size:15px}.sp small{font-size:12px;font-weight:700}
  .srow.open{background:#faf4e8;border-radius:12px}
  .strade{padding:0 8px 12px}
  .tl{font-size:13px;font-weight:700;margin:6px 0 4px}.tl small{font-weight:400;color:var(--sub)}
  .tb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .tb button{border:1.5px solid var(--ink);border-radius:10px;padding:8px 0;font-weight:700;background:#ffe1e1;cursor:pointer}
  .tb button.sell{background:#dde9ff}
  .tb button:disabled{opacity:.35}
  .lrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .lrow span{width:20px;font-weight:900}.lrow b{flex:1}.lrow small{color:var(--sub)}.lrow em{font-style:normal;font-weight:900}
  /* 도구 */
  .gauge{position:relative;height:14px;background:#eee3cf;border-radius:7px;margin-top:12px;border:1.5px solid var(--ink);overflow:hidden}
  .gauge div{height:100%}
  .gauge i{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
  .gl{position:relative;height:16px;font-size:11px;color:var(--sub)}
  .gl span{position:absolute;transform:translateX(-50%)}.gl span:first-child{transform:none}.gl span:last-child{transform:none}
  .cbar{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
  .cbar span{width:96px;flex:none}.cbar div{flex:1;height:10px;background:#eee3cf;border-radius:5px;overflow:hidden}
  .cbar i{display:block;height:100%;background:var(--red)}.cbar b{width:56px;text-align:right;flex:none}
  .mbtn{border:1.5px solid var(--ink);background:#fff;border-radius:10px;width:36px;height:36px;font-size:14px;cursor:pointer}
  .catpick{display:flex;flex-wrap:wrap;gap:6px}
  .catpick button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 10px;font-size:13px;cursor:pointer}
  .catpick button.on{border-color:var(--ink);background:var(--yellow);font-weight:700}
  .lent{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .lent .ld{width:34px;font-size:13px;color:var(--sub)}
  .lent div{flex:1;min-width:0}.lent div b{font-size:14px;display:block}.lent div small{font-size:12px;color:var(--sub)}
  .lent em{font-style:normal;font-weight:900;font-size:14px}
  .lent button{border:0;background:none;color:#bbb;font-size:14px;cursor:pointer}
  input[type=date]{font-family:inherit}
  /* 용어 풀이 */
  .explain{background:#fff7d6;border:2px solid var(--ink);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
  .explain h3{font-family:'Jua';font-weight:400;font-size:20px;margin-bottom:6px}
  .explain .one{font-size:15px;line-height:1.65;margin-bottom:10px}
  .flow{display:flex;align-items:stretch;gap:4px;margin:10px 0}
  .flow div{flex:1;background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;line-height:1.45}
  .flow div b{display:block;font-size:14px}
  .flow span{align-self:center;font-weight:900}
  .flow .bad{background:#ffe1e1}
  .explain ul{padding-left:18px;font-size:14px;line-height:1.7}
  details.term{border-top:1px dashed #e0cf8a;padding:8px 0 0;margin-top:8px}
  details.term summary{font-weight:700;font-size:14px;cursor:pointer;list-style:none}
  details.term summary::-webkit-details-marker{display:none}
  details.term summary::before{content:'＋ ';color:var(--sub)}
  details.term[open] summary::before{content:'－ '}
  details.term p{font-size:13.5px;line-height:1.65;color:#4a4238;margin-top:4px}
  .q{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);font-size:11px;font-weight:900;margin-left:4px;cursor:pointer;background:#fff;vertical-align:1px}
  .qa{display:none;font-size:12.5px;line-height:1.6;background:#faf4e8;border-radius:10px;padding:8px 10px;margin:-2px 0 6px;color:#4a4238}
  .qa.on{display:block}
  /* 공부 */
  .lessoncard h2{font-size:24px;margin-bottom:10px}
  .oneline{background:#fff7d6;border:1.5px solid var(--ink);border-radius:12px;padding:10px 12px;font-weight:700;font-size:15px;line-height:1.6;margin-bottom:12px}
  .lessoncard .body{font-size:15.5px;line-height:1.85;margin-bottom:12px}
  .analogy{background:#eef6ff;border-radius:12px;padding:12px;font-size:14.5px;line-height:1.7}
  .term{border-bottom:2px dotted var(--ink);cursor:pointer;font-weight:700}
  .oneline .term{border-bottom-color:#a08600}
  .termpop{background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px;animation:in .2s}
  .termpop b{display:block;font-size:15px;margin-bottom:4px}
  .termpop p{font-size:14px;line-height:1.65}
  .termpop button{margin-top:8px;background:var(--yellow);border:0;border-radius:8px;padding:5px 10px;font-weight:700;cursor:pointer}
  .lsnlist{display:flex;flex-direction:column;gap:6px;margin-top:14px}
  .lsnlist button{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer}
  .lsnlist button.on{border-color:var(--ink);font-weight:700;background:#fff7d6}
  .mini{height:6px;background:#eee3cf;border-radius:3px;overflow:hidden;margin:8px 0 2px}
  .mini i{display:block;height:100%;background:var(--green)}
  .studybar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .studybar button{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:11px 10px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:var(--shadow);text-align:left;display:flex;align-items:center;gap:6px;min-width:0}
  .studybar button .sbt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .studybar button.done::after{content:'✓';margin-left:auto;color:#1a9e55;font-weight:900}
  .tagline{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:900;margin-bottom:6px}
  .steps3{display:flex;align-items:center;gap:4px;margin-top:14px}
  .steps3 div{flex:1;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:8px 2px;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
  .steps3 span{font-size:20px;display:block}
  .steps3 b{display:block;font-size:12.5px}
  .steps3 small{font-size:11px;color:var(--sub)}
  .steps3 i{font-style:normal;font-weight:900}
  .logo .lg{font-size:24px;margin-right:2px}
  .topr{display:flex;align-items:center;gap:8px}
  .acc{border:2px solid var(--ink);background:#fff;border-radius:20px;padding:5px 10px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 var(--ink);max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acc.dim{opacity:.6;box-shadow:none}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .mbox{background:#fff;border:2px solid var(--ink);border-radius:18px;padding:18px;max-width:380px;width:100%;box-shadow:var(--shadow)}

function cashOut(amt){ // 생활비 통장에서 즉시 빠져나감
  const out = [];
  G.live -= amt; out.push({k:'생활비', v:-amt});

  return out;
}
function cover(){ // 생활비가 마이너스면 비상금 → 현금서비스 순으로 메움
  const out = [];
  if(G.live < 0 && G.emerg > 0){
    const t = Math.min(G.emerg, -G.live); G.emerg -= t; G.live += t;
    out.push({k:'비상금에서 메움', v:-t});
  }
  if(G.live < 0){
    const t = -G.live; G.cash += t; G.live = 0;
    out.push({k:'현금서비스(빚)', v:+t, bad:true});
    trap('cash');
  }
  return out;
}

function renderEvent(flash){
  if(G.step >= G.events.length){ return renderBill(); }
  const id = G.events[G.step], e = EVENTS[id];
  G.day = e.day;
  const avBg = {kakao:'#fef01b', sms:'#e8f0ff', push:'#ffe1e1', life:'#eee'}[e.type];
  const bubCls = {kakao:'', sms:'sms', push:'push', life:'life'}[e.type];
  $('#v-game').innerHTML = hud(flash) + `
    <div class="box ev">
      <div class="from"><div class="av" style="background:${avBg}">${e.av}</div><div><b>${e.from}</b><small>${e.time}</small></div></div>
      <div class="bub ${bubCls}">${e.msg}</div>
      ${G.diff==='easy'&&HINTS[id]?`<div class="hintbox">💡 힌트: ${HINTS[id]}</div>`:''}
      ${G.diff==='hell'?`<div class="tbar"><div id="tbarIn"></div></div><small class="tleft" id="tleft"></small>`:''}
      <div class="choices" id="chs">${e.ch.map((c,i)=>`<button class="ch" onclick="choose(${i})">${c.t}${G.diff==='hell'||!c.s?'':`<small>${c.s}</small>`}</button>`).join('')}</div>
      <div id="res"></div>
    </div>`;
  clearInterval(G.timer); G.answered = false;
  if(G.diff==='hell'){
    let left = 12; const step = G.step;
    const tick = ()=>{ const b=$('#tbarIn'); if(!b || G.step!==step || G.answered){ clearInterval(G.timer); return; }
      b.style.width = (left/12*100)+'%'; b.style.background = left<=4?'var(--red)':'var(--ink)';
      $('#tleft').textContent = `⏰ ${left}초 안에 답하세요`;
      if(left<=0){ clearInterval(G.timer); choose(e.timeoutIdx ?? e.ch.length-1, true); return; } if(!HOW_OPEN) left--; };
    tick(); G.timer = setInterval(tick, 1000);
  }
}
function choose(i, timeout){
  if(G.answered) return; G.answered = true; clearInterval(G.timer);
  const tb = document.querySelector('.tbar'); if(tb){ tb.remove(); const tl=$('#tleft'); if(tl) tl.remove(); }
  const e = EVENTS[G.events[G.step]];
  const before = {live:G.live, card:G.card, emerg:G.emerg, save:G.save, happy:G.happy};
  const r = e.ch[i].run();
  $('#chs').innerHTML = `<button class="ch" disabled style="opacity:.6">${e.ch[i].t}</button>`;
  const chips = (r.fx||[]).filter(Boolean).map(f=>{
    if(f.mood) return `<span class="chip ${f.v>=0?'p':'m'}">기분 ${f.v>0?'+':''}${f.v}</span>`;
    const neg = f.bad ? f.v>0 : f.v<0;
    return `<span class="chip ${neg?'m':'p'}">${f.k} ${f.v>0?'+':''}${man(f.v)}</span>`;
  }).join('');
  $('#res').innerHTML = `<div class="res">
      ${timeout?'<p style="color:var(--red);font-weight:700">⏰ 시간 초과! 머뭇거리다 이렇게 됐어요.</p>':''}
      <p>${r.m}</p>
      ${chips?`<div class="chips">${chips}</div>`:''}
      ${r.tip&&G.diff!=='hell'?`<div class="tipbox"><b>💡 ${r.tip[0]}</b>${r.tip[1]}</div>`:''}
      <button class="btn dark" onclick="nextEvent()">다음 →</button></div>`;
  G._flash = {live:G.live-before.live, card:G.card-before.card, emerg:G.emerg-before.emerg, save:G.save-before.save, happy:G.happy-before.happy};
  Object.keys(G._flash).forEach(k=>{ if(!G._flash[k]) delete G._flash[k]; });
  // HUD 즉시 갱신
  const h = document.querySelector('.hud'); if(h) h.outerHTML = hud(G._flash);
  if(G.traps.length && ['smishing','coin'].includes(G.events[G.step]) && G.live < before.live) document.querySelector('.ev').classList.add('shake');
  $('#res').scrollIntoView({behavior:'smooth', block:'nearest'});
}
function nextEvent(){ G.step++; renderEvent(); window.scrollTo(0,0); }

/* 3단계: 결제일 */
function renderBill(){
  G.day = 30;
  const bill = G.card;
  let pay = bill, carry = 0;
  if(G.revolvingOn && bill>0){ pay = Math.ceil(bill*0.1/100)*100; carry = bill - pay; }
  const liveBefore = G.live;
  G.live -= pay;
  const covered = [];
  if(G.live < 0 && G.emerg > 0){ const t=Math.min(G.emerg,-G.live); G.emerg-=t; G.live+=t; covered.push(['비상금에서 메움', t]); }
  if(G.live < 0){ const t=-G.live; G.cash+=t; G.live=0; covered.push(['부족해서 현금서비스', t]); trap('cash'); }
  G.revolving = carry;
  if(carry>0) trap('revolving');
  G.card = 0;
  const revFee = Math.round(carry*REV_RATE/12);
  G.bill = {bill, pay, carry, revFee, covered};
  $('#v-game').innerHTML = hud() + `
    <div class="box">
      <div style="font-size:36px;text-align:center">📆</div>
      <h2 style="text-align:center">30일, 카드 결제일</h2>
      <div class="bill" style="margin-top:10px">
        <div class="row"><span>이번 달 카드 사용액</span><b>${won(bill)}</b></div>
        ${G.revolvingOn?`<div class="row"><span>🌀 리볼빙 10%만 결제</span><b>${won(pay)}</b></div>
        <div class="row" style="color:var(--red)"><span>다음 달로 넘어간 돈 (빚)</span><b>${won(carry)}</b></div>
        <div class="row" style="color:var(--red)"><span>여기에 붙는 수수료 (한 달 예상)</span><b>약 ${won(revFee)}</b></div>`
        :`<div class="row"><span>생활비 통장에서 결제</span><b>${won(pay)}</b></div>`}
        ${covered.map(c=>`<div class="row" style="color:var(--red)"><span>${c[0]}</span><b>${won(c[1])}</b></div>`).join('')}
        <div class="row tot"><span>결제 후 생활비 잔액</span><span>${won(G.live)}</span></div>
      </div>
      ${G.revolvingOn && carry>0 ? `<div class="tipbox" style="margin-top:12px"><b>😮 어? 통장에 돈이 많이 남았네?</b>리볼빙 때문에 카드값의 90%를 안 낸 거라서 그래요. 이 돈은 남은 게 아니라 <b style="display:inline">빌린 돈</b>이에요.</div>`:''}
      <button class="btn" style="margin-top:12px" onclick="renderResult()">한 달 결산 보기 →</button>
    </div>`;
}

function makeHouse(spec){
  // spec: {traps:[...]} 또는 {safe:'clean'}
  const traps = spec.traps||[];
  let typePool = traps.length ? TRAPS[traps[0]].fits.filter(t=>traps.every(k=>TRAPS[k].fits.includes(t))) : Object.keys(TYPES);
  if(spec.safe && SAFES[spec.safe].onlyType) typePool=[SAFES[spec.safe].onlyType];
  const type = rpick(typePool), T = TYPES[type];
  const H = {type, kind:T.use, emoji:T.e, name:rpick(T.n), area:rpick(AREAS), owner:nameP(), since:2014+Math.floor(rnd(0,9)),
    price:R10(rnd(...T.price)), traps, safe:!!spec.safe, seed:Math.floor(Math.random()*1e6), floors: type==='apt'?Math.floor(rnd(12,22)):type==='offi'?Math.floor(rnd(10,16)):Math.floor(rnd(3,6))};
  if(type==='newvilla'){ H.since=2026; H.newbuild=true; }
  H.deposit = R10(H.price*rnd(.55,.65));
  traps.slice().sort((a,b)=>(a==='mortgage')-(b==='mortgage')).forEach(k=>TRAPS[k].setup && TRAPS[k].setup(H));
  if(spec.safe && SAFES[spec.safe].setup) SAFES[spec.safe].setup(H);
  if(H.deposit >= H.price && !traps.includes('kkang')) H.deposit = R10(H.price*.6);
  if(H.newbuild && type!=='newvilla' && !H.name.startsWith('신축')) H.name='신축 '+H.name;
  const D = {
    '매물 정보':[L(`전세 보증금 ${EOK(H.deposit)}`), L(H.newbuild?`같은 건물 분양 실거래 ${EOK(H.price)} (전세가율 약 ${pctS(H.deposit/H.price)})`:`최근 매매 실거래 ${EOK(H.price)} (전세가율 약 ${pctS(H.deposit/H.price)})`), L(H.newbuild?'2026년 준공':rpick(FEATS))].filter(l=>l.t),
    '등기부 갑구':[...(H.newbuild?[L('소유권 보존 OO건설 (2026년 3월)')]:[]), L(`소유자 ${H.owner} (${H.since}년부터)`), L('압류·가압류·가등기·신탁 기록 없음')],
    '등기부 을구':[L('근저당권 기록 없음')],
    '건축물대장':[L(`용도: ${T.use} / 위반건축물 표시 없음`)],
    '계약 현장':[L(`집주인 ${H.owner} 본인이 신분증 들고 직접 나옴`), L(`보증금 입금 계좌: ${H.owner} 명의`)]
  };
  traps.forEach(k=>TRAPS[k].apply(D,H));
  if(spec.safe) SAFES[spec.safe].apply(D,H);
  H.docs = Object.entries(D).map(([tab,lines])=>({tab, lines}));
  // 결과
  if(spec.safe){
    H.loss=0; H.lesson=SAFES[spec.safe].lesson;
    H.opts=[{t:'계약한다 (잔금 날 전입신고 + 확정일자)', k:'sign', ok:true},{t:'뭔가 찜찜하니 계약 안 한다', k:'skip', ok:false}];
    H.end={sign:`2년 뒤 계약이 끝나고 보증금 ${EOK(H.deposit)}을 그대로 돌려받았다. 깔끔!`, skip:'의심만 하다가 괜찮은 집을 놓쳤다. 다음 집은 조건이 더 나빴다…'};
  } else if(traps.length===1){
    const P = TRAPS[traps[0]];
    H.loss = Math.max(1e7, P.loss(H)); H.lesson = P.lesson;
    H.opts = [{t:P.sign, k:'sign', ok:false}, ...(P.special?[{t:P.special, k:'special', ok:true}]:[]), {t:'계약 안 한다', k:'skip', ok:true}];
    H.end = {sign:P.end(H,H.loss), skip:P.skipEnd, ...(P.special?{special:P.specialEnd}:{})};
  } else {
    const [A,B] = traps.map(k=>TRAPS[k]);
    H.loss = Math.min(H.deposit, A.loss(H)+B.loss(H));
    H.lesson = ['⚠️ 함정 두 개짜리 집', `${A.lesson[0]} + ${B.lesson[0]}. 하나만 찾고 "이 정도는 괜찮겠지" 하면 안 돼요. 서류 탭을 끝까지 다 봐야 해요.`];
    H.lessonsMulti = [A.lesson, B.lesson];
    H.opts = [{t:rpick([A.sign,B.sign]), k:'sign', ok:false}, {t:'계약 안 한다', k:'skip', ok:true}];
    H.end = {sign:`함정이 하나가 아니었다. ${A.short} 게다가 ${B.short} 합쳐서 ${EOK(H.loss)}을 잃었다.`, skip:'수상한 게 한두 개가 아니었다. 잘 피했다!'};
  }
  // 선택지 순서 섞기 (첫 번째가 늘 오답이 되지 않게)
  H.opts = H.opts.sort(()=>Math.random()-.5);
  return H;
}
function buildJeonseSet(d){
  const keys = Object.keys(TRAPS).sort(()=>Math.random()-.5);
  const nRisky = d==='easy'?2:4, specs=[];
  for(let i=0;i<nRisky;i++) specs.push({traps:[keys[i]]});
  if(d==='hell'){ // 1~2채는 함정 두 개
    const nDouble = 1 + (Math.random()<.5?1:0);
    for(let j=0;j<nDouble;j++){ const a=specs[j].traps[0]; const b=keys.slice(nRisky).concat(keys).find(k=>okPair(a,k)); if(b) specs[j].traps.push(b); }
  }
  const safePool = d==='easy' ? ['clean'] : d==='normal' ? ['clean','oldloan','smallloan','legalroof'] : ['oldloan','smallloan','goodagent','legalroof'];
  const nSafe = d==='hell'?2:1;
  safePool.sort(()=>Math.random()-.5).slice(0,nSafe).forEach(s=>specs.push({safe:s}));
  const H = {}; specs.sort(()=>Math.random()-.5).forEach((s,i)=>H['h'+i]=makeHouse(s));
  return H;
}

/* 집 그림 (SVG) */
function houseSVG(H){
  let s = H.seed; const r = ()=>{ s=(s*9301+49297)%233280; return s/233280; };
  const pal = [['#ffd6a5','#e07a5f'],['#cde7f0','#3d5a80'],['#e9f5db','#6a994e'],['#f8edeb','#b5838d'],['#fff3b0','#e09f3e'],['#e2ece9','#577590']];
  const [wall, accent] = pal[Math.floor(r()*pal.length)];
  const sky = H.traps.length && J && J.diff==='hell' ? '#dfe6f3' : '#e8f4ff';
  const W=320, G=150; let b='';
  const win = (x,y,w,h,lit) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${lit?'#fff7c2':'#bfe0ff'}" stroke="#1f1a14" stroke-width="1.6"/>`;
  if(H.type==='apt'){
    const fl=Math.min(9,Math.floor(H.floors/2.2)), bw=110, bh=fl*13+14, x=(W-bw)/2, y=G-bh;
    b+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${wall}" stroke="#1f1a14" stroke-width="2.5"/>`;
    b+=`<rect x="${x-4}" y="${y-8}" width="${bw+8}" height="10" fill="${accent}" stroke="#1f1a14" stroke-width="2.5"/>`;
    for(let f=0;f<fl;f++) for(let c=0;c<5;c++) b+=win(x+8+c*20.5,y+8+f*13,13,8,r()<.25);
    b+=`<rect x="${x+bw+10}" y="${G-bh*.7}" width="56" height="${bh*.7}" fill="${wall}" opacity=".55" stroke="#1f1a14" stroke-width="2"/>`;
    b+=`<rect x="${x-62}" y="${G-bh*.8}" width="52" height="${bh*.8}" fill="${wall}" opacity=".55" stroke="#1f1a14" stroke-width="2"/>`;
  } else if(H.type==='offi'){
    const bw=84, bh=Math.min(128,H.floors*8+20), x=(W-bw)/2, y=G-bh;
    b+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="#cfe3f5" stroke="#1f1a14" stroke-width="2.5"/>`;
    for(let i=1;i<4;i++) b+=`<line x1="${x+i*bw/4}" y1="${y}" x2="${x+i*bw/4}" y2="${G}" stroke="#1f1a14" stroke-width="1.2" opacity=".6"/>`;
    for(let j=12;j<bh;j+=12) b+=`<line x1="${x}" y1="${y+j}" x2="${x+bw}" y2="${y+j}" stroke="#1f1a14" stroke-width="1" opacity=".35"/>`;
    b+=`<path d="M${x+8} ${y+10} L${x+30} ${y+40}" stroke="#fff" stroke-width="4" opacity=".7"/>`;
    b+=`<rect x="${x+bw/2-12}" y="${G-20}" width="24" height="20" fill="${accent}" stroke="#1f1a14" stroke-width="2"/>`;
  } else {
    const fl=H.floors, bw=124, fh=22, bh=fl*fh+(H.type==='roof'?0:6), x=(W-bw)/2, y=G-bh;
    b+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${wall}" stroke="#1f1a14" stroke-width="2.5"/>`;
    b+=`<rect x="${x}" y="${G-fh}" width="${bw}" height="${fh}" fill="#d9d2c5" stroke="#1f1a14" stroke-width="2.5"/>`;
    for(let c=0;c<4;c++) b+=`<rect x="${x+8+c*30}" y="${G-fh}" width="5" height="${fh}" fill="#1f1a14" opacity=".55"/>`;
    for(let f=1;f<fl;f++) for(let c=0;c<3;c++) b+=win(x+12+c*38,y+6+(f-1)*fh,24,12,r()<.3);
    if(H.newbuild||H.type==='newvilla') b+=`<rect x="${x+bw-46}" y="${y-16}" width="50" height="16" rx="3" fill="#ff6b6b" stroke="#1f1a14" stroke-width="2"/><text x="${x+bw-21}" y="${y-4}" font-size="10" font-weight="800" text-anchor="middle" fill="#fff">신축 분양</text>`;
    if(H.type==='roof') b+=`<rect x="${x+14}" y="${y-26}" width="46" height="26" fill="${accent}" stroke="#1f1a14" stroke-width="2.5"/><path d="M${x+10} ${y-26} L${x+37} ${y-40} L${x+64} ${y-26} Z" fill="#8d6e63" stroke="#1f1a14" stroke-width="2.5"/>${win(x+28,y-18,16,10,true)}`;
    b+=`<rect x="${x-3}" y="${y-5}" width="${bw+6}" height="6" fill="${accent}" stroke="#1f1a14" stroke-width="2"/>`;
  }
  const tree = tx => `<rect x="${tx-2}" y="${G-14}" width="4" height="14" fill="#8d6e63"/><circle cx="${tx}" cy="${G-20}" r="11" fill="#8fd694" stroke="#1f1a14" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${W} 160" class="hsvg" role="img" aria-label="${H.name} 그림">
    <rect width="${W}" height="160" fill="${sky}"/><circle cx="${40+r()*240}" cy="26" r="12" fill="#ffd23f" opacity=".9"/>
    ${b}${tree(30)}${tree(292)}<rect y="${G}" width="${W}" height="10" fill="#c9b79c" stroke="#1f1a14" stroke-width="2"/></svg>`;
}

function addNoise(docs){
  return docs.map(d=>{ const pool=(NOISE[d.tab]||[]).slice().sort(()=>Math.random()-.5).slice(0, 1+Math.floor(Math.random()*2));
    const lines=d.lines.slice(); pool.forEach(t=>lines.splice(Math.floor(Math.random()*(lines.length+1)),0,{t})); return {tab:d.tab, lines}; });
}

function jDecide(oi){

  const wrong = [...J.cur.marks].filter(m=>!flagIds.includes(m)).length;
  J.found += found; J.flags += flagIds.length; J.wrong += wrong;
  let money, cls;

const MONTHS = 12; let START_CASH = 10000000, SELL_COST = 0.002, LOAN_RATE = 0.007;

function buildMarket(seed){
  const r = rng(seed);
  const gauss = ()=>{ let u=0,v=0; while(!u)u=r(); while(!v)v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  const pickN = (arr,n)=>{ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a.slice(0,n); };
  const rk = Object.keys(REGIMES)[Math.floor(r()*5)], R = REGIMES[rk];
  const crash = !R.crash ? -1 : rk==='vshape' ? 2+Math.floor(r()*2) : 5+Math.floor(r()*4);
  const T = THEME_POOL[Math.floor(r()*THEME_POOL.length)];
  const theme = {id:'theme', name:T.name, emoji:T.emoji, p0:[2800,3500,4200,5100][Math.floor(r()*4)], desc:'요즘 커뮤니티에서 핫한 테마주', T};
  const tStart = 1+Math.floor(r()*4);          // 테마 급등 시작 달 (1~4)
  const tPeak = tStart+2;                     // 3달 오르고 꼭대기
  const stocks = [ETF_DEF, ...pickN(STOCK_POOL,4), theme];
  // 시장 전체 흐름
  const mkt=[0];
  for(let m=1;m<=MONTHS;m++){
    let x = R.drift + .03*gauss();
    if(m===crash) x = -.15 - r()*.06;
    if(crash>0 && m===crash+1) x = .04 + r()*.03;
    if(crash>0 && m===crash+2) x += .03;
    if(rk==='vshape' && m>crash && m<=crash+4) x += .02;
    mkt.push(x);
  }
  // 회사별 사건
  const corp = {};
  const evTypes = ['earnUp','earnDown','contract','fraud','earnUp','earnDown'];
  pickN(stocks.slice(1,5),3).forEach(s=>{
    const m = 1+Math.floor(r()*MONTHS); const t = evTypes[Math.floor(r()*evTypes.length)];
    if(m!==crash) corp[s.id] = {m, t};
  });
  const prices={}, rets={};
  stocks.forEach(s=>{
    const p=[s.p0], rr=[0];
    for(let m=1;m<=MONTHS;m++){
      let x;
      if(s.id==='theme'){
        const d = m - tStart;
        x = d<0 ? (r()-.5)*.08 : [.28,.5,.55,-.55,-.45,-.25][d] ?? (r()-.55)*.08;
        if(d===3 && r()<.35){ x = .2; } // 가끔 한 달 더 오르고 꺾임
      } else if(s.id==='etf'){
        x = mkt[m] + s.sd*gauss();
      } else {
        x = s.beta*mkt[m] + s.mu + s.sd*gauss();
        const c = corp[s.id];
        if(c && c.m===m) x = {earnUp:.22,earnDown:-.24,contract:.28,fraud:-.45}[c.t] + (r()-.5)*.06;
      }
      x = Math.max(-.7, x);
      rr.push(x);
      let np = p[m-1]*(1+x); np = s.p0>=10000 ? Math.round(np/50)*50 : Math.round(np/5)*5;
      p.push(Math.max(5,np));
    }
    prices[s.id]=p; rets[s.id]=rr;
  });
  // 실제 테마 꼭대기 달(가격이 가장 높은 달)
  const tp = prices.theme; let peakM = tStart; for(let m=1;m<=MONTHS;m++) if(tp[m]>tp[peakM]) peakM=m;
  // 유혹 이벤트 배치
  const events = {};
  const leadM = Math.min(MONTHS-1, Math.max(1, peakM-1));
  events[leadM] = 'leading';
  if(crash>0) events[crash] = 'panic';
  const pool = pickN(['senior','credit','youtuber','flex','ipo','dca','fomo_etf'], 7);
  for(const k of pool){
    const free = []; for(let m=1;m<MONTHS;m++) if(!events[m] && !events[m-1] && !events[m+1]) free.push(m);
    if(!free.length || Object.keys(events).length>=5) break;
    events[free[Math.floor(r()*free.length)]] = k;
  }
  const extra = {seniorPick: stocks[1+Math.floor(r()*4)].id, ytPick: stocks[1+Math.floor(r()*4)].id, ipoPop: [-.25,-.1,.15,.6,1.1][Math.floor(r()*5)]};
  const RUMOR_T = ['[찌라시] {n} 대기업 인수설 돌아… "다음 주 발표"','[받은글] {n} 다음 주 상한가 간다더라 (지인 증권사 직원 피셜)','[속보?] {n} 정부 지원 대상 선정 임박설','[찌라시] {n} 해외 대형 계약 사실상 확정']; 
  const rumors = {};
  for(let k=0;k<3;k++){ const m=1+Math.floor(r()*MONTHS), s=stocks[1+Math.floor(r()*4)]; rumors[m] = RUMOR_T[Math.floor(r()*RUMOR_T.length)].replace('{n}', s.name); }
  return {seed, rk, R, crash, stocks, prices, rets, corp, tStart, peakM, events, extra, rumors};
}

  if(k==='panic') return {av:'😱', from:'내 마음속 목소리', msg:'계좌가 파랗다… 더 떨어지기 전에 다 팔아야 하나?',
    ch:[{t:'무서워! 전부 판다', run:()=>{ const v=holdVal(); S.Mk.stocks.forEach(s=>sSell(s.id,1)); S.panic=true; return `전부 팔았다. ${won(v)}어치가 현금이 됐다. 마음은 편한데…`; }},
        {t:'원래 계획대로 버틴다', run:()=>{ S.goods.push('폭락장 존버'); return '눈 딱 감고 앱을 껐다.'; }},
        {t:'싸졌으니 ETF를 더 산다', run:()=>{ sBuy('etf', S.cash*.5); S.goods.push('폭락장 분할매수'); return '현금 절반으로 ETF를 더 샀다. 떨어질 때 나눠 사는 것도 방법이다.'; }}]};
  return null;
}
function px(id, m){ return S.Mk.prices[id][m ?? S.m]; }
function holdVal(){ return S.Mk.stocks.reduce((a,s)=>a+S.hold[s.id]*px(s.id),0); }
function equity(){ return S.cash + holdVal() - S.loan; }
function sBuy(id, amt){ const p=px(id); const q=Math.floor(Math.max(0,Math.min(amt,S.cash))/p); if(q<=0) return 0; S.hold[id]+=q; S.cash-=q*p; S.cost[id]+=q*p; S.trades++; return q; }
function sSell(id, frac){ const q=Math.floor(S.hold[id]*frac); if(q<=0) return 0; const p=px(id); const avg=S.cost[id]/S.hold[id]; S.cost[id]-=avg*q; S.hold[id]-=q; S.cash+=q*p*(1-SELL_COST); S.fees+=q*p*SELL_COST; S.trades++; return q; }

function sAct(kind,id,f){

function sEv(i){ const ev = stockEvent(S.m); S.evDone[S.m]=true; const t = ev.ch[i].run(); renderMarket(t); }
function nextMonth(){
  if(S.m>=MONTHS) return renderStockResult();
  S.m++;
  const msgs = [];
  const b = S.Mk.stocks.find(s=>s.div);
  if(b && (S.m===6||S.m===12) && S.hold[b.id]>0){ const d=Math.round(S.hold[b.id]*px(b.id)*.025); S.cash+=d; S.divs+=d; msgs.push(`🏦 배당금 ${won(d)}이 들어왔어요.`); }
  if(S.dca && S.m<MONTHS){ const q=sBuy('etf', Math.min(300000,S.cash)); if(q){ S.dcaTotal+=q*px('etf'); msgs.push(`🔁 적립식으로 ETF ${q}주를 자동으로 샀어요.`); } }
  if(S.loan){
    const it = Math.round(S.loan*LOAN_RATE); S.cash -= it; S.interest=(S.interest||0)+it;
    msgs.push(`💳 신용 이자 ${won(it)}가 빠져나갔어요.`);
    const hv = holdVal();
    if(hv>0 && (S.cash+hv-S.loan) < hv*0.4){
      S.Mk.stocks.forEach(s=>sSell(s.id,1)); S.cash -= S.loan; S.loan=0; S.margin=true;
      msgs.length=0; msgs.push(`💥 <b>반대매매!</b> 손실이 커져서 증권사가 내 주식을 강제로 전부 팔고 빌린 돈을 가져갔어요.`);

      <h2>🏠 전세가율 계산기</h2>

      <div class="explain" style="margin:12px 0 4px;box-shadow:none">
        <h3>전세가율이 뭐예요?</h3>
        <p class="one" style="font-size:14px;margin-bottom:0"><b>집값 중에 내 보증금이 몇 %인지</b>예요. 3억짜리 집에 보증금 2억이면 약 67%. 이 비율이 높을수록 집을 팔아도 내 보증금을 다 돌려받기 어려워져요.</p>
        <details class="term"><summary>근저당이 뭐예요?</summary><p>집주인이 이 집을 담보로 은행 등에서 빌린 돈이에요. 집이 경매로 넘어가면 보통 먼저 등록된 쪽이 먼저 돈을 가져가요. 그래서 내 보증금 앞에 있는 대출은 꼭 더해서 봐야 해요.</p></details>
        <details class="term"><summary>채권최고액은 뭐예요?</summary><p>등기부 을구에 적힌, 은행이 이 집에서 최대로 받아 갈 수 있는 금액이에요. 실제 빌린 돈보다 보통 더 크게 잡혀 있어요. 계산할 땐 이 금액을 넣는 게 안전해요.</p></details>
        <details class="term"><summary>깡통전세는 뭐예요?</summary><p>보증금과 대출을 합친 돈이 집값에 거의 맞먹거나 넘는 집이에요. 집주인이 돈이 없으면 집을 팔아도 보증금을 다 못 돌려줘요.</p></details>
      </div>
      <label class="f">매매 시세 (실거래가 기준)</label><div class="inp"><input id="jp" inputmode="numeric" value="300,000,000"><span>원</span></div>
      <label class="f">내 전세 보증금</label><div class="inp"><input id="jd" inputmode="numeric" value="200,000,000"><span>원</span></div>
      <label class="f">집주인 대출 (등기부 을구 채권최고액 합계)<span class="q" onclick="this.parentNode.nextElementSibling.classList.toggle('on')">?</span></label>
      <div class="qa">등기부등본 "을구"에 적힌 근저당권의 채권최고액을 모두 더해서 넣어요. 을구에 아무것도 없으면 0원이에요. 다가구주택이면 나보다 먼저 들어온 세입자들의 보증금도 더해요.</div><div class="inp"><input id="jm" inputmode="numeric" value="0"><span>원</span></div>
      <div class="out" id="jout"></div>
      <p class="note">※ 흔히 (보증금 + 선순위 채권)이 시세의 70% 이하면 비교적 안전, 70~80%는 주의, 80%를 넘으면 위험 신호로 봐요. 절대 기준은 아니에요. 다가구주택은 다른 세입자의 선순위 보증금도 더해야 해요.<br>시세는 국토교통부 실거래가 공개시스템(rt.molit.go.kr), 등기부는 인터넷등기소(iros.go.kr)에서 확인할 수 있어요.</p>
    </div>`;
  const num = id => +(($('#'+id).value||'').replace(/[^0-9]/g,''))||0;
  const calc = ()=>{
    const p=num('jp'), d=num('jd'), m=num('jm');
    if(!p){ $('#jout').innerHTML='<p class="s">매매 시세를 입력해 주세요</p>'; return; }
    const r1=d/p, r2=(d+m)/p;
    const lv = r2<=.7?['비교적 안전','var(--green)','😊']:r2<=.8?['주의','#d97706','🤔']:['위험 신호','var(--red)','🚨'];
    const pct = Math.min(130, r2*100);
    $('#jout').innerHTML = `
      <div class="row"><span>전세가율 (보증금 ÷ 시세)</span><b>${(r1*100).toFixed(1)}%</b></div>
      <div class="big"><span>보증금 + 대출 ÷ 시세</span><b style="color:${lv[1]}">${(r2*100).toFixed(1)}%</b></div>
      <div class="gauge"><div style="width:${pct/1.3}%;background:${lv[1]}"></div><i style="left:${70/1.3}%"></i><i style="left:${80/1.3}%"></i></div>
      <div class="gl"><span>0%</span><span style="left:${70/1.3}%">70</span><span style="left:${80/1.3}%">80</span><span style="right:0">130%</span></div>
      <p style="font-size:15px;font-weight:700;margin-top:10px;color:${lv[1]}">${lv[2]} ${lv[0]}</p>
      ${r2>1?`<p class="s">빚과 보증금을 합친 돈이 집값보다 많아요. 집을 팔아도 보증금을 다 못 돌려받을 수 있어요.</p>`:''}
      ${r2>.8&&r2<=1?`<p class="s">집값이 조금만 떨어져도 보증금을 다 돌려받기 어려울 수 있어요. 보증금을 낮추거나 보증보험 가입 가능 여부를 꼭 확인하세요.</p>`:''}`;
  };
  ['jp','jd','jm'].forEach(id=>{ const el=$('#'+id); el.addEventListener('input',()=>{ const v=el.value.replace(/[^0-9]/g,''); el.value=v?(+v).toLocaleString('ko-KR'):''; calc(); }); });
  calc();
}

/* ============ 도구: 한 달 가계부 ============ */
const CATS_OUT = ['🍚 식비','☕ 카페·간식','🚌 교통','🏠 주거·통신','🛍️ 쇼핑','🎮 문화·여가','💐 경조사','💊 의료','🔁 구독','📦 기타'];
const CATS_IN = ['💰 월급','🎁 용돈','💵 기타 수입'];
let LG = {ym:null, type:'out'};
function ledger(){ return store.get('tj_ledger', []); }
function renderLedger(){
  const now = new Date();
  if(!LG.ym) LG.ym = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const all = ledger(), list = all.filter(e=>e.d.startsWith(LG.ym)).sort((a,b)=>b.d.localeCompare(a.d)||b.ts-a.ts);
  const inc = list.filter(e=>e.type==='in').reduce((a,e)=>a+e.amt,0), out = list.filter(e=>e.type==='out').reduce((a,e)=>a+e.amt,0);
  const byCat = {}; list.filter(e=>e.type==='out').forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amt);
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const [y,mo] = LG.ym.split('-').map(Number);
  const today = now.toISOString().slice(0,10);
  const defDay = LG.ym===today.slice(0,7) ? today : LG.ym+'-01';
  $('#v-tool').innerHTML = `
    <div class="box">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <button class="mbtn" onclick="lgMove(-1)">◀</button>
        <h2 style="margin:0">📒 ${y}년 ${mo}월</h2>
        <button class="mbtn" onclick="lgMove(1)">▶</button>
      </div>
      <div class="stats" style="grid-template-columns:repeat(3,1fr);margin-top:12px">
        <div class="st"><small>수입</small><b style="color:var(--green)">${man(inc)}</b></div>
        <div class="st"><small>지출</small><b style="color:var(--red)">${man(out)}</b></div>
        <div class="st ${inc-out<0?'warn':''}"><small>남은 돈</small><b>${man(inc-out)}</b></div>
      </div>
      ${cats.length?`<div style="margin-top:14px">${cats.map(([c,v])=>`<div class="cbar"><span>${c}</span><div><i style="width:${v/cats[0][1]*100}%"></i></div><b>${man(v)}</b></div>`).join('')}</div>`:''}
      ${inc>0&&out>0?`<p class="s" style="margin-top:8px">수입의 <b>${Math.round(out/inc*100)}%</b>를 썼어요. ${cats[0]?`가장 많이 쓴 곳은 <b>${cats[0][0]}</b>.`:''}</p>`:''}
    </div>
    <div class="box">
      <h3>✏️ 기록하기</h3>
      <div class="seg"><button id="lt-out" class="${LG.type==='out'?'on':''}" onclick="lgType('out')">지출</button><button id="lt-in" class="${LG.type==='in'?'on':''}" onclick="lgType('in')">수입</button></div>
      <div class="catpick">${(LG.type==='out'?CATS_OUT:CATS_IN).map((c,i)=>`<button class="${i===0?'on':''}" data-c="${c}" onclick="document.querySelectorAll('.catpick button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${c}</button>`).join('')}</div>
      <div class="row2" style="margin-top:8px">
        <div class="inp"><input id="la" inputmode="numeric" placeholder="금액"><span>원</span></div>
        <div class="inp" style="flex:.8"><input id="ld" type="date" value="${defDay}"></div>
      </div>
      <div class="inp" style="margin-top:8px"><input id="lm" maxlength="20" placeholder="메모 (선택)"></div>
      <button class="btn" style="margin-top:10px" onclick="lgAdd()">추가</button>
    </div>
    <div class="box">
      <h3>📋 내역 ${list.length?`<small style="font-weight:400;color:var(--sub);font-size:13px">${list.length}건</small>`:''}</h3>
      ${list.length?list.map(e=>`<div class="lent"><span class="ld">${+e.d.slice(8)}일</span><div><b>${e.cat}</b>${e.memo?`<small>${esc(e.memo)}</small>`:''}</div><em style="color:${e.type==='in'?'var(--green)':'var(--ink)'}">${e.type==='in'?'+':'-'}${e.amt.toLocaleString()}</em><button onclick="lgDel(${e.ts})">✕</button></div>`).join(''):'<p class="s">아직 기록이 없어요.</p>'}
    </div>
    <p class="foot">기록은 지금 쓰는 이 기기 브라우저에만 저장돼요. 브라우저 기록을 지우면 사라질 수 있어요.</p>`;
  const la=$('#la'); la.addEventListener('input',()=>{ const v=la.value.replace(/[^0-9]/g,''); la.value=v?(+v).toLocaleString('ko-KR'):''; });
}
function lgType(t){ const a=$('#la').value, d=$('#ld').value, m=$('#lm').value; LG.type=t; renderLedger(); $('#la').value=a; $('#ld').value=d; $('#lm').value=m; }
function lgMove(d){ let [y,m]=LG.ym.split('-').map(Number); m+=d; if(m<1){m=12;y--;} if(m>12){m=1;y++;} LG.ym=y+'-'+String(m).padStart(2,'0'); renderLedger(); }
function lgAdd(){
  const amt = +($('#la').value||'').replace(/[^0-9]/g,''); const d=$('#ld').value; const cat=(document.querySelector('.catpick button.on')||{}).dataset?.c;
  if(!amt) return toast('금액을 입력해 주세요'); if(!d) return toast('날짜를 골라 주세요');
  const all = ledger(); all.push({type:LG.type, cat, amt, d, memo:($('#lm').value||'').trim(), ts:Date.now()});
  store.set('tj_ledger', all); LG.ym = d.slice(0,7); renderLedger(); toast('기록했어요');
}
function lgDel(ts){ store.set('tj_ledger', ledger().filter(e=>e.ts!==ts)); renderLedger(); }

function studyDone(){ return store.get('tj_study', {}); }
function renderStudy(chap, li){
  if(!chap) return renderStudyHome();
  const C = STUDY.find(c=>c.id===chap); if(!C) return renderStudyHome();
  const i = Math.max(0, Math.min(li||0, C.lessons.length-1)), L = C.lessons[i];
  const done = studyDone();
  const mark = id => { const d=studyDone(); d[id]=1; store.set('tj_study', d); };
  mark(C.id+'-'+i);
  const termify = t => t.replace(/\[\[(.+?)\]\]/g, (_,w)=>`<span class="term" onclick="showTerm('${w}')">${w}</span>`);
  const last = i===C.lessons.length-1;
  $('#v-study').innerHTML = `
    <div class="dayrow" style="margin-bottom:8px"><b>${C.emoji} ${C.title}</b><span>${i+1} / ${C.lessons.length}</span></div>
    <div class="dbar" style="margin-bottom:12px"><div style="width:${(i+1)/C.lessons.length*100}%"></div></div>
    <div class="box lessoncard">
      <h2>${L.t}</h2>
      <div class="oneline">💡 ${termify(L.one)}</div>
      <p class="body">${termify(L.body)}</p>
      ${L.flow?termify(flowHtml(L.flow)):''}
      <div class="analogy">${L.ex}</div>
      <p class="note">밑줄 친 단어를 누르면 뜻을 볼 수 있어요. · 2026년 11월 기준</p>
    </div>
    <div id="termPop"></div>
    <div class="row2">
      <button class="btn white" onclick="renderStudy('${C.id}',${i-1})" ${i===0?'disabled':''}>← 이전</button>
      ${last?`<button class="btn" onclick="renderStudyEnd('${C.id}')">다 읽었어요 ✓</button>`:`<button class="btn" onclick="renderStudy('${C.id}',${i+1})">다음 →</button>`}
    </div>
    <div class="lsnlist">${C.lessons.map((x,k)=>`<button class="${k===i?'on':''}" onclick="renderStudy('${C.id}',${k})">${done[C.id+'-'+k]||k===i?'✓':k+1} ${x.t}</button>`).join('')}</div>
    <button class="toplink" style="display:block;margin:14px auto 0" onclick="renderStudy()">← 공부 목록으로</button>`;
  try{ history.replaceState(null,'','#study'); }catch(e){}
  window.scrollTo(0,0);
}
function renderStudyEnd(chap){
  const C = STUDY.find(c=>c.id===chap);
  const next = STUDY[STUDY.indexOf(C)+1];
  $('#v-study').innerHTML = `
    <div class="box result">
      <div style="font-size:48px">🎉</div>
      <div class="ttl">${C.title} 끝!</div>
      <p class="one">이제 배운 걸 직접 써 볼 차례예요.</p>
    </div>
    ${C.game?`<button class="btn" style="margin-bottom:10px" onclick="go('${C.game[0]==='salary'?'game':C.game[0]}')">${C.game[1]} 해 보기</button>`:''}
    ${C.tool?`<button class="btn white" style="margin-bottom:10px" onclick="go('tool','${C.tool[0]}')">${C.tool[1]} 써 보기</button>`:''}
    ${next?`<button class="btn white" style="margin-bottom:10px" onclick="renderStudy('${next.id}',0)">다음 단원: ${next.emoji} ${next.title} →</button>`:''}
    <button class="toplink" style="display:block;margin:10px auto 0" onclick="renderStudy()">← 공부 목록으로</button>`;
  window.scrollTo(0,0);
}
function showTerm(w){
  const d = DICT[w]; if(!d) return;
  $('#termPop').innerHTML = `<div class="termpop"><b>📖 ${w}</b><p>${d}</p><button onclick="this.parentNode.remove()">닫기</button></div>`;
  $('#termPop').scrollIntoView({behavior:'smooth', block:'nearest'});
}
function renderStudyHome(q){
  const done = studyDone();
  const query = (q||'').trim();
  const terms = Object.keys(DICT).filter(k=>!query || k.includes(query) || DICT[k].includes(query));
  $('#v-study').innerHTML = `
    <div class="box hero" style="background:linear-gradient(160deg,#d9f7e3,#b8efcb)">
      <div class="big">📚</div>
      <h1 style="font-size:26px">처음 듣는 사람도<br>읽히는 돈 공부</h1>
      <p>어려운 말은 쉬운 말과 비유로 풀었어요. 한 장에 한 가지씩, 1분이면 읽어요.</p>
      <p class="asof">📅 2026년 11월 기준 내용이에요. 요율·세금·거래 시간 같은 제도는 바뀔 수 있으니, 실제로 쓰기 전엔 공식 안내를 한 번 더 확인하세요.</p>
    </div>
    ${STUDY.map(C=>{ const n=C.lessons.filter((_,k)=>done[C.id+'-'+k]).length;
      return `<div class="box game" onclick="renderStudy('${C.id}',0)">
        <div class="ic" style="background:#fff">${C.emoji}</div>
        <div class="tx"><b>${C.title}${n===C.lessons.length?'<span class="badge new">완료</span>':''}</b><small>${C.sub}</small>
          <div class="mini"><i style="width:${n/C.lessons.length*100}%"></i></div><small>${n} / ${C.lessons.length}장 읽음</small></div>
      </div>`; }).join('')}
    <div class="sec" id="dictsec">📖 용어 사전 <small style="font-family:'Noto Sans KR';font-size:13px;color:var(--sub)">${Object.keys(DICT).length}개</small></div>
    <div class="box">
      <div class="inp"><input id="dq" placeholder="모르는 단어 검색 (예: 리볼빙)" value="${esc(query)}"><span>🔍</span></div>
      <div class="dchips"><button data-c="all" class="${dictCat==='all'?'on':''}" onclick="setDictCat('all')">전체</button>${DICT_CAT.map(c=>`<button data-c="${c.id}" class="${dictCat===c.id?'on':''}" onclick="setDictCat('${c.id}')">${c.e} ${c.n}</button>`).join('')}</div>
      <div id="dlist" style="margin-top:4px">${dictList(query)}</div>
    </div>`;
  const inp = $('#dq'); inp.addEventListener('input', ()=>{ $('#dlist').innerHTML = dictList(inp.value); });
  try{ history.replaceState(null,'','#study'); }catch(e){}
}


/* ============ Firebase: 로그인 · 전체 랭킹 · 개인 데이터 저장 ============
   👇 Firebase 콘솔 > 프로젝트 설정 > 내 앱에서 복사한 값을 붙여넣으세요.
   비워 두면 로그인 없이 "이 기기에만 저장" 모드로 동작해요.
   Firestore 보안 규칙은 이 파일 맨 아래 주석에 있어요. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDsNIoyAcyFsFtKiot3-JyHMHBUZDIFl_Y",
  authDomain: "tulijima.firebaseapp.com",
  projectId: "tulijima",
  appId: "1:572055494908:web:e69672b360397a31293779"
};
const SYNC_KEYS = ['tj_ledger','tj_study','tj_best','tj_jbest'];
const Cloud = {on:false, user:null, db:null, auth:null, profile:null, status:'local', pushT:null};
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('load fail')); document.head.appendChild(s); }); }
function localSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
async function initCloud(){
  if(!FIREBASE_CONFIG.apiKey){ Cloud.status='local'; renderAccount(); return; }
  Cloud.status='loading'; renderAccount();
  try{
    const base='https://www.gstatic.com/firebasejs/10.12.2/';
    await loadScript(base+'firebase-app-compat.js');
    await loadScript(base+'firebase-auth-compat.js');
    await loadScript(base+'firebase-firestore-compat.js');
    firebase.initializeApp(FIREBASE_CONFIG);
    Cloud.auth = firebase.auth(); Cloud.db = firebase.firestore(); Cloud.on = true; Cloud.status='ready';
    Cloud.auth.getRedirectResult().catch(e=>console.warn(e));
    Cloud.auth.onAuthStateChanged(async u=>{
      Cloud.user = u; Cloud.profile = null;
      if(u) await pullUser();
      renderAccount(); refreshView();
    });
  }catch(e){ console.warn(e); Cloud.status='fail'; }
  renderAccount();
}
const GRANK = {S:5,A:4,B:3,C:2,F:1};
function betterBest(a,b){ if(!a) return b||null; if(!b) return a; return (GRANK[a.grade]||0) >= (GRANK[b.grade]||0) ? a : b; }
async function pullUser(){
  const ref = Cloud.db.collection('users').doc(Cloud.user.uid);
  try{
    const snap = await ref.get(); const d = snap.exists ? snap.data() : {}; const c = d.data || {};
    Cloud.profile = {name: d.name || null};
    // 로그인 전에 이 기기에서 쓴 기록 + 계정 기록 합치기
    const map = {}; [...(c.tj_ledger||[]), ...store.get('tj_ledger',[])].forEach(e=>{ if(e && e.ts) map[e.ts]=e; });
    localSet('tj_ledger', Object.values(map));
    localSet('tj_study', Object.assign({}, c.tj_study||{}, store.get('tj_study',{})));
    localSet('tj_best', betterBest(c.tj_best, store.get('tj_best',null)));
    localSet('tj_jbest', betterBest(c.tj_jbest, store.get('tj_jbest',null)));
    await pushNow();
    Cloud.sync = 'ok';
  }catch(e){ console.warn(e); Cloud.sync='fail'; toast('계정 기록을 불러오지 못했어요'); }
}
function schedulePush(){ if(!Cloud.user) return; clearTimeout(Cloud.pushT); Cloud.pushT = setTimeout(pushNow, 800); }
async function pushNow(){
  if(!Cloud.user) return;
  const data = {}; SYNC_KEYS.forEach(k=>{ const v=store.get(k,null); if(v!==null) data[k]=v; });
  try{
    await Cloud.db.collection('users').doc(Cloud.user.uid).set({data, name:(Cloud.profile&&Cloud.profile.name)||null, updatedAt: firebase.firestore.FieldValue.serverTimestamp()}, {merge:true});
    Cloud.sync='ok';
  }catch(e){ console.warn(e); Cloud.sync='fail'; toast('저장에 실패했어요. 인터넷 연결을 확인해 주세요'); }
  if(curView==='me') renderMe();
}
function login(){
  if(!Cloud.on){ return showModal(`<b>로그인을 쓸 수 없어요</b><p>${Cloud.status==='fail'?'로그인 서버에 연결하지 못했어요. 잠시 뒤 다시 시도해 주세요.':'이 화면에서는 로그인 기능이 꺼져 있어요. 배포된 사이트에서 로그인할 수 있어요.'}</p>`); }
  if(/KAKAOTALK|Instagram|NAVER\(|FBAN|FBAV|Line\//i.test(navigator.userAgent)){
    return showModal('<b>앱 안 브라우저에서는 구글 로그인이 막혀요</b><p>카카오톡·인스타그램 같은 앱 안에서 열면 구글이 로그인을 막아요. 화면의 메뉴(⋮ 또는 공유 버튼)에서 <b>"다른 브라우저로 열기"</b>를 눌러 크롬이나 사파리에서 열어 주세요.</p>');
  }
  const p = new firebase.auth.GoogleAuthProvider();
  Cloud.auth.signInWithPopup(p).catch(e=>{
    if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request'].includes(e.code)) Cloud.auth.signInWithRedirect(p);
    else if(e.code!=='auth/popup-closed-by-user') toast('로그인 실패: '+(e.code||e.message));
  });
}
async function logout(){
  if(!Cloud.on) return;
  await pushNow();
  await Cloud.auth.signOut();
  SYNC_KEYS.forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
  toast('로그아웃했어요. 기록은 계정에 안전하게 저장돼 있어요');
  go('home');

const RESERVED = ['운영자','관리자','admin','털리지마','공식','official'];
function badNick(v){
  const n = v.toLowerCase().replace(/[\s\.\-_~!@#$%^&*()+=,'"`?/\\|<>\[\]{}:;0-9]/g,'');

async function submitScore(game, entry){
  const name = await ensureNickname(); if(!name) return {cancel:true};
  const id = Cloud.user.uid + '_' + (entry.diff||'normal') + (game==='stock' ? '_'+entry.code : '');
  const ref = Cloud.db.collection(RANK_COL[game]).doc(id);
  const old = await ref.get();
  if(old.exists && old.data().score >= entry.score) return {kept:true};
  await ref.set(Object.assign({}, entry, {uid:Cloud.user.uid, name, ts: firebase.firestore.FieldValue.serverTimestamp()}));
  return {ok:true};
}
async function fetchRank(game, code, diff){

  const col = Cloud.db.collection(RANK_COL[game]);
  const snap = code ? await col.where('code','==',code).limit(300).get() : await col.where('diff','==',diff).limit(300).get();
  return snap.docs.map(d=>d.data()).filter(x=>(x.diff||'normal')===diff).sort((a,b)=>b.score-a.score).slice(0,20);
}

/* ============ 결과 이미지 카드 (공유용) ============ */
const SITE_URL = 'tulijima.vercel.app';
function rr(x,X,Y,w,h,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }
function wrapText(x, text, cx, y, maxW, lh){
  const words = text.split(' '); let line=''; const lines=[];
  for(const w of words){ const t=line?line+' '+w:w; if(x.measureText(t).width>maxW && line){ lines.push(line); line=w; } else line=t; }
  if(line) lines.push(line);
  lines.forEach((l,i)=>x.fillText(l, cx, y+i*lh)); return lines.length;
}
async function makeCard(o){
  try{ await Promise.all([document.fonts.load('80px Jua'), document.fonts.load('700 40px "Noto Sans KR"')]); }catch(e){}
  const J = '"Jua","Noto Sans KR","Noto Sans CJK KR",sans-serif', N = '"Noto Sans KR","Noto Sans CJK KR",sans-serif';
  const W=1080, H=1350, c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  x.fillStyle='#ffd23f'; x.fillRect(0,0,W,H);
  // 카드
  x.fillStyle='#1f1a14'; rr(x,70,82,W-140,H-170,56); x.fill();
  x.fillStyle='#fff8ec'; rr(x,70,70,W-140,H-170,56); x.fill(); x.lineWidth=6; x.strokeStyle='#1f1a14'; x.stroke();
  x.textAlign='center'; x.textBaseline='alphabetic';
  // 게임 이름
  x.fillStyle='#7a6f62'; x.font=`700 40px ${N}`; x.fillText(o.gameName, W/2, 170);
  // 등급 원
  x.beginPath(); x.arc(W/2, 330, 110, 0, Math.PI*2); x.fillStyle=o.gColor; x.fill(); x.lineWidth=8; x.strokeStyle='#1f1a14'; x.stroke();
  x.fillStyle='#1f1a14'; x.font=`130px ${J}`; x.fillText(o.grade, W/2, 378);
  // 칭호
  x.font=`88px ${J}`; const n = wrapText(x, o.title, W/2, 560, W-240, 100);
  let y = 560 + (n-1)*100;
  // 한 줄 설명
  if(o.line){ x.fillStyle='#4a4238'; x.font=`500 38px ${N}`; y += wrapText(x, o.line, W/2, y+80, W-260, 52)*52 + 30; }
  // 큰 숫자 박스
  const bY = Math.max(y+40, 800);
  x.fillStyle='#ffffff'; rr(x,150,bY,W-300,230,36); x.fill(); x.lineWidth=5; x.strokeStyle='#1f1a14'; x.stroke();
  x.fillStyle='#7a6f62'; x.font=`700 36px ${N}`; x.fillText(o.bigLabel, W/2, bY+70);
  x.fillStyle=o.bigColor||'#1f1a14'; x.font=`104px ${J}`; x.fillText(o.big, W/2, bY+185);
  // 아래
  x.fillStyle='#1f1a14'; x.font=`64px ${J}`; x.fillText('💸 털리지 마', W/2, H-200);
  x.fillStyle='#7a6f62'; x.font=`700 36px ${N}`; x.fillText(`너도 해봐 👉 ${SITE_URL}`, W/2, H-140);
  return c;
}

    {t:'손절·익절·물타기', one:'감정이 아니라 미리 정한 계획대로 움직이는 게 핵심이에요.',

      ['📅','다음 달로','"다음 달로 →"를 누르면 한 달이 지나고 가격이 바뀌어요. 빨강 ▲ 상승, 파랑 ▼ 하락이에요.'],
      ['📊','1년 결산','12달이 지나면 수익률이 나오고, "처음에 ETF만 사고 그냥 뒀다면"과 "예금에 넣었다면"과 비교해요.']],
    score:'ETF만 사고 둔 것보다 2%p 이상 잘하면 S, 비슷하면 A, 손해만 안 봤으면 B예요. 빚투로 반대매매를 당하거나 몰빵·잦은 매매를 하면 칭호로 놀림받아요.',
    tip:'친구와 같은 <b>대결 코드</b>를 넣으면 똑같은 시장이 나와요. 끝나고 수익률로 겨뤄 보세요. 매달 다 사고팔 필요 없어요. 가만히 있는 것도 전략이에요.'}
};
function howBox(game){
  const H = HOWTO[game]; const seen = store.get('tj_howseen_'+game, false);
  return `<details class="box howto" ${seen?'':'open'}>
    <summary onclick="store.set('tj_howseen_${game}',true)">📖 어떻게 하는 게임이에요?</summary>
    <p class="hgoal">${H.goal}</p>
    <ol class="hsteps">${H.steps.map(([e,t,d])=>`<li><span>${e}</span><div><b>${t}</b><p>${d}</p></div></li>`).join('')}</ol>
    <div class="hscore"><b>🏅 점수는 이렇게</b><p>${H.score}</p></div>
    <div class="tipbox" style="margin:10px 0 0"><b>💡 팁</b>${H.tip}</div>
  </details>`;
}


let HOW_OPEN = false;
const howBtn = g => `<button class="howbtn" onclick="howModal('${g}')">📖 게임 방법 보기</button>`;
function howAuto(g){ if(!store.get('tj_howoff_'+g,false)) setTimeout(()=>{ if(!HOW_OPEN) howModal(g, true); }, 250); }
function howModal(g, auto){
  const H = HOWTO[g]; if(!H) return; closeHow();
  const inGame = (g==='game'&&G&&G.diff&&!G.result&&curView==='game'&&!$('#v-game .dpick')) || (g==='jeonse'&&J&&J.cur&&curView==='jeonse') || (g==='stock'&&S&&S.Mk&&!S.res&&curView==='stock'&&!$('#v-stock .dpick'));
  const hell = (g==='game'&&G&&G.diff==='hell') || (g==='jeonse'&&J&&J.diff==='hell');
  const name = {game:'💰 첫 월급 한 달 버티기', jeonse:'🏠 이 집 계약해도 될까?', stock:'📈 주린이 생존기'}[g];
  const m = document.createElement('div'); m.className='modal'; m.id='howm';
  m.innerHTML = `<div class="hbox" role="dialog" aria-label="게임 방법">
    <div class="hbh"><b>📖 게임 방법</b><button onclick="closeHow()" aria-label="닫기">✕</button></div>
    <div class="hbb">
      <div class="hname">${name}</div>
      ${inGame&&hell?'<div class="tipbox" style="margin:8px 0">⏸️ 이 창을 보는 동안은 타이머가 멈춰요.</div>':''}
      <p class="hgoal">${H.goal}</p>
      <ol class="hsteps">${H.steps.map(([e,t,d])=>`<li><span>${e}</span><div><b>${t}</b><p>${d}</p></div></li>`).join('')}</ol>
      <div class="hscore"><b>🏅 점수는 이렇게</b><p>${H.score}</p></div>
      <div class="tipbox" style="margin:10px 0 0"><b>💡 팁</b>${H.tip}</div>
    </div>
    <div class="hbf">
      ${auto?`<label class="hoff"><input type="checkbox" id="howoff" ${store.get('tj_howoff_'+g,false)?'checked':''}> 다음부터 자동으로 띄우지 않기</label>`:''}
      <button class="btn" onclick="${auto?`store.set('tj_howoff_${g}', $('#howoff').checked);`:''}closeHow()">${inGame?'게임으로 돌아가기':'알겠어요! 난이도 고르러 가기'}</button>
    </div>
  </div>`;
  m.addEventListener('click', ev=>{ if(ev.target===m) closeHow(); });
  document.body.appendChild(m); HOW_OPEN = true; document.body.style.overflow='hidden';
}
function closeHow(){ const m=$('#howm'); if(m) m.remove(); HOW_OPEN=false; document.body.style.overflow=''; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && HOW_OPEN) closeHow(); });

/* ============ 시작 ============ */
const h = (location.hash||'').slice(1);
initCloud();
if(h==='salary') go('game'); else if(['jeonse','stock','study','rank','me','games','tools'].includes(h)) go(h); else if(['saving','revolving','jrate','ledger'].includes(h)) go('tool',h); else go('home');
</script>
</body>
</html>
